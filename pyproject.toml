[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
description = "Course AgentOS kernel: syscall-grain cooperative scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agentos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
